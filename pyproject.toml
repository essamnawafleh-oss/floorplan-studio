[project]
name = "floorplan-studio"
version = "0.1.0"
description = "Rule-based floor plan generator (2D / CAD / 3D)"
requires-python = ">=3.10"
dependencies = ["shapely>=2.0", "ezdxf>=1.3", "trimesh>=4.0", "mapbox_earcut>=1.0"]

[project.scripts]
floorplan = "floorplan.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
