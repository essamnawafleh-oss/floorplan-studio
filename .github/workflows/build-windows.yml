name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt "PySide6>=6.8,<6.9"
          # PyInstaller with a bootloader compiled here (not the prebuilt one antivirus engines know)
          pip install --no-binary pyinstaller "pyinstaller>=6.5"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          python -m pytest -q

      - name: Build app folder
        run: pyinstaller FloorPlanStudio.spec --noconfirm

      - name: Smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\FloorPlanStudio\FloorPlanStudio.exe -ArgumentList "--selftest", "selftest_out" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
          if (-not (Test-Path selftest_out\selftest_ok.txt)) { throw "selftest did not finish" }
          Get-ChildItem selftest_out

      - name: Installer + portable zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $env:APP_VERSION = (python -c "import floorplan; print(floorplan.__version__)")
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path dist\FloorPlanStudio -DestinationPath dist\FloorPlanStudio-portable.zip -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: FloorPlanStudio-windows
          path: |
            dist/FloorPlanStudio-Setup.exe
            dist/FloorPlanStudio-portable.zip

      - name: Publish to Releases (latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/FloorPlanStudio-Setup.exe dist/FloorPlanStudio-portable.zip \
            --title "Floor Plan Studio - latest build" \
            --notes "Windows build of commit ${GITHUB_SHA::7}.
          - FloorPlanStudio-Setup.exe: installer (recommended) / برنامج التثبيت (مُفضّل)
          - FloorPlanStudio-portable.zip: no install, unzip and run FloorPlanStudio.exe / بدون تثبيت: فك الضغط وشغّل" \
            --target "$GITHUB_SHA"
